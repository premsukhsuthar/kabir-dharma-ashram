{% extends 'base.html' %}
{% load i18n %}
{% block content %}

<div class="page-header">
    <h1>{% trans "Events & Satsang" %}</h1>
</div>

<div class="section">
    {% for event in events %}
        <div class="card">
            <h3>{{ event.title }}</h3>
            <p>{{ event.date }}</p>
            <p>{{ event.description }}</p>
        </div>
    {% empty %}
        <p>{% trans "No upcoming events." %}</p>
    {% endfor %}
</div>

{% endblock %}
